<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 400" width="3840" height="960" role="img" aria-labelledby="title desc"><title id="title">Simply Intelligence — startup</title><desc id="desc">Terminal de Simply Intelligence con comando de despliegue, enlace simplyintel.cl y actividad animada.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#060c10"/><stop offset=".53" stop-color="#0b171a"/><stop offset="1" stop-color="#071713"/></linearGradient>
  <linearGradient id="flash" x1="0" x2="1"><stop stop-color="#10b981" stop-opacity="0"/><stop offset=".5" stop-color="#70ffd0" stop-opacity=".68"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#0bc18a" stop-opacity=".21"/><stop offset="1" stop-color="#0bc18a" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#74bfa8" opacity=".11"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" /></filter>
</defs>
<style><![CDATA[
 .mono{font-family:'DejaVu Sans Mono',Consolas,Monaco,monospace}
 .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
 .blink{animation:blink 1.1s steps(2,end) infinite}
 .breathe{animation:breathe 3.3s ease-in-out infinite}
 .float{animation:float 4s ease-in-out infinite}
 .scan{animation:scan 9s linear infinite}
 .dash{animation:dash 12s linear infinite}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
 @keyframes breathe{0%,100%{opacity:.34}50%{opacity:.9}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes scan{from{transform:translateX(-850px)}to{transform:translateX(1650px)}}
 @keyframes dash{to{stroke-dashoffset:-800}}
 ]]></style>
